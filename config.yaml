models:
  plate_detector_path: models/plate_detector/placas_roboflow.pt
  plate_detector_model: models/plate_detector/placas_roboflow.pt
  character_reader_path: models/character_reader/character_cnn.keras

paths:
  input_dir: data/input
  output_dir: data/output
  reports_dir: reports/evidencias

speed:
  default_distance_meters: 10.0
  default_time_seconds: 1.5
  campus_speed_limit_kmh: 30.0
  # Distancia medida en calle entre las marcas fisicas de Linea 1 y Linea 2.
  # La velocidad usa tic-toc geometrico: v = distancia_m / delta_t * 3.6

ocr:
  default_mode: manual_controlado
  manual_test_plate: PBC1234

plate_crop_selection:
  enabled: true
  buffer_frames: 15
  min_aspect_ratio: 1.5
  max_aspect_ratio: 6.5
  min_area_relative: 0.0003
  max_area_relative: 0.08
  border_margin_px: 5
  min_sharpness: 30.0
  cooldown_frames: 15
  min_score_improvement: 0.03

monitoring_performance:
  video:
    yolo_every_n_frames: 8
    inference_size: 416
    render_every_n_frames: 1
    max_display_fps: 0
    max_frame_width: 854
    preview_width: 420
  camara:
    yolo_every_n_frames: 5
    inference_size: 416
    max_display_fps: 0
    max_frame_width: 0
    preview_width: 960
  rapido:
    yolo_every_n_frames: 5
    inference_size: 416
    render_every_n_frames: 1
    history_max: 10
    max_display_fps: 0
  balanceado:
    yolo_every_n_frames: 5
    inference_size: 512
    render_every_n_frames: 1
    history_max: 10
    max_display_fps: 0
  preciso:
    yolo_every_n_frames: 3
    inference_size: 640
    render_every_n_frames: 1
    history_max: 10
    max_display_fps: 0

fuzzy:
  seguro_hasta: 20
  permitido_hasta: 30
  precaucion_hasta: 35
  exceso_leve_hasta: 40
  exceso_medio_hasta: 50
  solapamiento_kmh: 2.0
  multa_usd:
    seguro: 0
    permitido: 0
    precaucion: 0
    exceso_leve: 15
    exceso_medio: 35
    exceso_alto: 60
  suspension_horas:
    seguro: 0
    permitido: 0
    precaucion: 0
    exceso_leve: 2
    exceso_medio: 6
    exceso_alto: 12

notificaciones:
  # Configuracion SMTP. Por seguridad, las credenciales se leen preferentemente
  # de variables de entorno (ver .env.example):
  #   FOTORRADAR_SMTP_HOST, FOTORRADAR_SMTP_PORT, FOTORRADAR_SMTP_USER,
  #   FOTORRADAR_SMTP_PASSWORD, FOTORRADAR_SMTP_FROM, FOTORRADAR_SMTP_SECURITY
  # Si no hay credenciales, el correo se genera en modo simulado (a disco).
  smtp_host: smtp.gmail.com
  smtp_port: 587
  smtp_seguridad: starttls   # starttls (587) o ssl (465)
  remitente: ""
  smtp_user: ""
  smtp_password: ""
  # Candado de calidad: evita enviar correos de placas incompletas / poco confiables.
  calidad:
    exigir_formato_valido: true
    confianza_minima: 0.55
    aspect_min: 1.8
    aspect_max: 5.0
    nitidez_minima: 30.0
    longitud_min: 6
    longitud_max: 7
    permitir_envio_si_no_apto: false
  # Agrupa eventos cercanos en frames (mismo paso de vehiculo) y envia solo la mejor lectura.
  envio_automatico: true
  ventana_frames_mismo_paso: 150
  # En vivo: enviar al tener 2 lecturas consistentes o una lectura de confianza >= 0.80.
  lecturas_minimas_confirmacion: 2
  confianza_envio_inmediato: 0.80
  # Evita doble correo si el tracker divide accidentalmente la misma placa.
  ventana_frames_mismo_vehiculo: 150
  cooldown_frames_envio: 60
